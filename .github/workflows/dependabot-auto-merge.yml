name: Dependabot auto-merge

# Turns on auto-merge for Dependabot PRs. GitHub merges them only once the checks required by the
# `require-ci` ruleset (lint, every test job, build) pass; a red PR stays open for review.
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
