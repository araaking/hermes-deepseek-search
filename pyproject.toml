[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "hermes-deepseek-search"
version = "0.3.0"
description = "DeepSeek Search & Fetch web provider for Hermes Agent (web_search + web_extract)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "araaking" }]
keywords = ["hermes-agent", "deepseek", "web-search", "plugin", "mcp", "rag", "llm-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27,<1"]

[project.optional-dependencies]
# Range must include Hermes 0.22's own pin (mcp==2.0.0): Hermes locks this file, extras included.
mcp = ["mcp>=2.0,<3"]

[project.urls]
Homepage = "https://github.com/araaking/hermes-deepseek-search"
Repository = "https://github.com/araaking/hermes-deepseek-search"
Issues = "https://github.com/araaking/hermes-deepseek-search/issues"
Changelog = "https://github.com/araaking/hermes-deepseek-search/blob/main/CHANGELOG.md"

[project.scripts]
deepseek-search-mcp = "hermes_deepseek_search.mcp_server:main"

[project.entry-points."hermes_agent.plugins"]
web-deepseek = "hermes_deepseek_search.hermes"

# Floors only; uv.lock pins the exact versions CI uses. Hermes 0.22 resolves this group together with its own
# exact dev pins when it installs the plugin, so an exact pin here that differs from Hermes' breaks the install.
[dependency-groups]
dev = [
  "mcp>=2.0",
  "pytest>=9.1",
  "pytest-asyncio>=1.3",
  "pytest-cov>=7.1",
  "ruff>=0.15.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/hermes_deepseek_search"]

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".github", ".venv", "dist", ".coverage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live: hits the real DeepSeek API (spends money; needs DEEPSEEK_API_KEY; select with -m live)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
preview = true
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "PLW1514"]

[tool.ruff.lint.isort]
# The repo root is itself a package (the Hermes directory-plugin wrapper), which hides `tests` from detection.
known-first-party = ["hermes_deepseek_search", "tests"]
